version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sga_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sga_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: sga_fastapi
    restart: always
    depends_on:
      - db
    environment:
      POSTGRES_SERVER: db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sga_db
      POSTGRES_PORT: 5432
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-sga-super-secret-key-2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    ports:
      - "8000:8000"

volumes:
  pgdata:
